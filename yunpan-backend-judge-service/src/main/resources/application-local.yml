# 公共配置文件
# @author lgg
# @from 云盘在线判题平台
spring:
  # 默认 dev 环境
  profiles:
    active: prod
  application:
    name: yunpan-backend-judge-service

  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # session 配置
  session:
    store-type: redis
    # 30 天过期
    timeout: 2592000
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.159.110:3306/yunpan
    username: root
    password: 123
  # Redis 配置
  redis:
    database: 1
    host: 192.168.159.110
    port: 6379
    timeout: 5000
    password: 123
    username: default
  servlet:
    multipart:
      # 大小限制
      max-file-size: 10MB
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.159.110:8848
  rabbitmq:
    host: 192.168.159.110
    port: 5672
    password: admin
    username: admin
server:
  port: 8104
  servlet:
    context-path: /api/judge
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
        path: /api
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 代码沙箱配置
# 代码沙箱配置
codesandbox:

  remote-host: 127.0.0.1:8090
  type: remote
knife4j:
  enable: true
  # 这个配置写在【Feign调用者】的yml
feign:
  client:
     config:
       default:
         loggerLevel: FULL
